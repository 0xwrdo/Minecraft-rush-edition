[workspace]
resolver = "2"
members = [
    "crates/mc-rand",
    "crates/mc-noise",
    "crates/mc-world",
    "crates/mc-game",
    "crates/mc-server",
    "crates/mc-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
